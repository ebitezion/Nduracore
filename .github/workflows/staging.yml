name: staging

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nduracore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_DSN: postgres://postgres:postgres@localhost:5432/nduracore_test?sslmode=disable
      INTEGRATION_TEST_DSN: postgres://postgres:postgres@localhost:5432/nduracore_test?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: true

      - name: Format check
        run: ./scripts/check_fmt.sh

      - name: Migration safety checks
        run: ./scripts/check_migrations.sh

      - name: Run tests
        run: go test ./... -v

  package:
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: true

      - name: Build nduracore binary
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -o dist/nduracore ./cmd/api
          tar -czf dist/nduracore-linux-amd64.tar.gz -C dist nduracore

      - name: Upload staging artifact
        uses: actions/upload-artifact@v4
        with:
          name: nduracore-linux-amd64
          path: dist/nduracore-linux-amd64.tar.gz

  deploy:
    runs-on: ubuntu-latest
    needs: package
    environment: staging

    steps:
      - name: Download staging artifact
        uses: actions/download-artifact@v4
        with:
          name: nduracore-linux-amd64
          path: dist

      - name: Execute staging deploy command
        env:
          STAGING_DEPLOY_COMMAND: ${{ secrets.STAGING_DEPLOY_COMMAND }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          if [ -z "$STAGING_DEPLOY_COMMAND" ]; then
            echo "STAGING_DEPLOY_COMMAND is not configured. Skipping remote deploy."
            exit 0
          fi
          bash -lc "$STAGING_DEPLOY_COMMAND"

      - name: Optional staging health check
        env:
          STAGING_HEALTHCHECK_URL: ${{ secrets.STAGING_HEALTHCHECK_URL }}
        run: |
          if [ -z "$STAGING_HEALTHCHECK_URL" ]; then
            echo "STAGING_HEALTHCHECK_URL not configured. Skipping health check."
            exit 0
          fi
          curl -fsSL "$STAGING_HEALTHCHECK_URL"
